# Local Postgres for a single Klippy server instance. Each PC runs its own; the
# plan is to point several instances at one shared database later, at which point
# this file is only used for development.
services:
  klippy-db:
    image: postgres:18-alpine
    container_name: klippy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: klippy
      POSTGRES_USER: klippy
      POSTGRES_PASSWORD: klippy
    ports:
      - "55432:5432"
    volumes:
      # Postgres 18+ wants the mount one level up: the image manages a
      # major-version subdirectory itself so pg_upgrade --link can work.
      - klippy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klippy -d klippy"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  klippy-pgdata:
